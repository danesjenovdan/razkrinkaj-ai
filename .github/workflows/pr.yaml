name: Automatic PRs
on:
  push:
    branches:
      - "kvizle-dz-2026"
jobs:
  pull_requests:
    name: Automatic PRs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Pull request to kvizle-dz-2026-k8s
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: "kvizle-dz-2026-k8s"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: "Pulling ${{ github.ref }} into kvizle-dz-2026-k8s"
