[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kvizle-dz-2026"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "Django==6.1.3",
    "psycopg==3.3.9",
    "boto3==1.43.127",
    "django-storages==1.14.6",
    "gunicorn==27.0.1",
    "django-cors-headers==4.9.0",
    "djangorestframework==3.18.3",
    "django-filter==26.2",
    "django-modelcluster==6.5",
    "django-taggit==6.1.0",
    "ipython==9.18.1",
    "pillow==13.0.0",
    "wagtail==8.1",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "django-stubs==5.2.2",
    "django-stubs-ext==6.1.2",
    "isort",
]

[tool.setuptools.packages.find]
include = ["api*", "home*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
