apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-domain
spec:
  redirectRegex:
    regex: ^https?://razkrinkaj-ai.djnd.si/(.*)
    replacement: https://razkrinkaj-ai.danesjenovdan.si/${1}
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: enable-cors
spec:
  headers:
    accessControlAllowOriginList:
      - "https://api.razkrinkaj-ai.danesjenovdan.si"
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - "*"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: razkrinkaj-ai
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: |
      traefik-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.razkrinkaj-ai.danesjenovdan.si
      secretName: razkrinkaj-ai-tls
  rules:
    - host: api.razkrinkaj-ai.danesjenovdan.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: razkrinkaj-ai
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: razkrinkaj-ai-frontend
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: |
      traefik-redirect-to-https@kubernetescrd,
      razkrinkaj-ai-redirect-domain@kubernetescrd,
      razkrinkaj-ai-enable-cors@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - razkrinkaj-ai.djnd.si
        - razkrinkaj-ai.danesjenovdan.si
      secretName: razkrinkaj-ai-frontend-tls
  rules:
    - host: razkrinkaj-ai.djnd.si
      http: &http_paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: razkrinkaj-ai-frontend
                port:
                  number: 80
    - host: razkrinkaj-ai.danesjenovdan.si
      http: *http_paths
