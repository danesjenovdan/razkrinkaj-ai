apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: max-body-size
spec:
  buffering:
    maxRequestBodyBytes: 10485760  # 10m
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: enable-cors
spec:
  headers:
    accessControlAllowOriginList:
      - "https://api.kvizle.si"
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - "*"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kvizle-dz-2026-backend
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: kvizle-max-body-size@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.kvizle.si
      secretName: kvizle-dz-2026-backend-tls
  rules:
    - host: api.kvizle.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kvizle-dz-2026-backend
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kvizle-dz-2026-frontend
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: kvizle-enable-cors@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kvizle.si
      secretName: kvizle-dz-2026-frontend-tls
  rules:
    - host: kvizle.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kvizle-dz-2026-frontend
                port:
                  number: 80
