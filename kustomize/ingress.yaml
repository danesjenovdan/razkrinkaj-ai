apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: max-body-size
spec:
  buffering:
    maxRequestBodyBytes: 10485760  # 10m
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: enable-cors
spec:
  headers:
    accessControlAllowOriginList:
      - "https://api.razkrinkaj.ai"
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - "*"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: razkrinkaj-ai
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: razkrinkaj-ai-max-body-size@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.razkrinkaj.ai
      secretName: razkrinkaj-ai-tls
  rules:
    - host: api.razkrinkaj.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: razkrinkaj-ai
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: razkrinkaj-ai-frontend
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: razkrinkaj-ai-enable-cors@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - razkrinkaj.ai
      secretName: razkrinkaj-ai-frontend-tls
  rules:
    - host: razkrinkaj.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: razkrinkaj-ai-frontend
                port:
                  number: 80
